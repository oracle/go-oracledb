name: List Go packages
description: Lists Go packages excluding CI-skipped directories

outputs:
  packages:
    description: Filtered Go packages
    value: ${{ steps.list.outputs.packages }}

runs:
  using: composite
  steps:
    - id: list
      shell: bash
      run: |
        {
          echo 'packages<<EOF'
          go list "${{ github.workspace }}/..." \
            | grep -v /vendor/ \
            | grep -v /examples/ \
            | grep -v /internal/tests
          echo EOF
        } >> "$GITHUB_OUTPUT"
