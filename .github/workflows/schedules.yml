name: functional-validation
on:
  schedule:
    - cron: '0 1 * * 1-5'
      timezone: "America/New_York"
      inputs:
        branch:
          description: Branch name
          required: false
          default: main
          type: string

  workflow_dispatch:
    inputs:
      branch:
        description: Branch name
        required: true
        type: string

env:
  ORACLE_DRIVER_MODULE: "github.com/oracle/go-driver/oracle"
  VALIDATION_USER_NAME: ogd_test_user

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true

jobs:

  functional_validate_driver:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-env
      - uses: gvenzl/setup-oracle-free@v1
        with:
          app-user: ${{ env.VALIDATION_USER_NAME }}
          app-user-password: ${{ secrets.test_user_password }}
          container-name: oracledb
      - uses: ./.github/actions/setup-test-configuration
        with:
          database-version: "26"
          database-service: "FREEPDB1"
          database-host: "localhost"
          database-user: ${{ env.VALIDATION_USER_NAME }}
          database-password: ${{ secrets.test_user_password }}
      - run: go test -parallel=10  -shuffle=on -v $ORACLE_DRIVER_MODULE -run TestCategoryExecutor -driver.config.filename=${{ github.workspace }}/go-driver-config.json -driver.config.name=pipeline_test  -test.category="functional"

  bench_driver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-env
      - uses: gvenzl/setup-oracle-free@v1
        with:
          app-user: ${{ env.VALIDATION_USER_NAME }}
          app-user-password: ${{ secrets.test_user_password }}
          container-name: oracledb
      - uses: ./.github/actions/setup-test-configuration
        with:
          database-version: "26"
          database-service: "FREEPDB1"
          database-host: "localhost"
          database-user: ${{ env.VALIDATION_USER_NAME }}
          database-password: ${{ secrets.test_user_password }}
      - run: go test -parallel=10  -shuffle=on -v $(go list ${{ github.workspace }}/oracle/... | egrep -v /vendor/) -run=^$ -bench=. -benchmem -benchtime=10x -driver.config.filename=${{ github.workspace }}/go-driver-config.json -driver.config.name=pipeline_test


