name: functional-validation
on:
  schedule:
    - cron: '0 1 * * 1-5'
      timezone: "America/New_York"
      inputs:
        branch:
          description: Branch name
          required: false
          default: main
          type: string

  workflow_dispatch:
    inputs:
      branch:
        description: Branch name
        required: true
        type: string
      test_category:
        description: The test category to run
        required: false
        type: string
        default: functional
env:
  COVERAGE_THRESHOLD: 80
  VALIDATION_USER_NAME: ogd_test_user

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true

jobs:
  functional_validate_driver:
    runs-on: [ self-hosted, Linux, X64, OracleTestPilot ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rdbms: base-database-service-19c
          - rdbms: base-database-service-21c
          - rdbms: base-database-service-26ai
          - rdbms: autonomous-transaction-processing-serverless-19c
          - rdbms: autonomous-transaction-processing-serverless-26ai
          - rdbms: base-database-service-26ai-rac
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1r
      - uses: ./.github/actions/setup-go-env
      - uses: ./.github/actions/list-go-packages
        id: go-packages
      - name: Create test database
        id: create_database
        uses: oracle-actions/setup-testpilot@ad55a0d7294112c44a9cc9a38f4b3d293da8fcf0 # 1.0.31
        with:
          oci-service: ${{ matrix.rdbms }}
          action: create
          user: ${{ env.VALIDATION_USER_NAME }}
          fully-qualified-names: true
      - uses: ./.github/actions/setup-test-configuration
        with:
          database-version: ${{ steps.create_database.outputs.database_version }}
          database-service: ${{ steps.create_database.outputs.database_service }}
          database-host: ${{ steps.create_database.outputs.database_host }}
          database-port: ${{ steps.create_database.outputs.database_port }}
          database-protocol: ${{ steps.create_database.outputs.database_protocol }}
          database-user: ${{ steps.create_database.outputs.database_user }}
          database-password: ${{ steps.create_database.outputs.database_password }}
      - run: |
          mkdir -p ${{ github.workspace }}/coverage/full_func
      - run: |
          go test -parallel=10  -shuffle=on -v ${{ steps.go-packages.outputs.packages }} -coverpkg=./... -cover -run TestCategoryExecutor -test.gocoverdir=${{ github.workspace }}/coverage/coverage/full_func -driver.config.filename=${{ github.workspace }}/go-driver-config.json -driver.config.name=pipeline_test  -test.category="sanity" -test.category="${{ github.event.inputs.test_category }}"
      - uses: oracle-actions/setup-testpilot@ad55a0d7294112c44a9cc9a38f4b3d293da8fcf0 # 1.0.31
        if: always()
        with:
          oci-service: ${{ matrix.rdbms }}
          action: delete
          user: ${{ env.VALIDATION_USER_NAME }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          - name: coverage-full-func
          - path: ${{ github.workspace }}/coverage/full_func
          - if-no-files-found: error

  no_resource_validate_driver:
    runs-on: [ self-hosted, Linux, X64, OracleTestPilot ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rdbms: base-database-service-26ai
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1r
      - uses: ./.github/actions/setup-go-env
      - uses: ./.github/actions/list-go-packages
        id: go-packages
      - run: |
          mkdir -p ${{ github.workspace }}/coverage/no_resources
      - run: |
          go test ${{ steps.go-packages.outputs.packages }} -coverpkg=./... -cover -run TestCategoryExecutor -test.gocoverdir=${{ github.workspace }}/coverage/coverage/no_resources -driver.config.filename=${{ github.workspace }}/go-driver-config.json -driver.config.name=pipeline_test  -test.category="unitary"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          - name: coverage-no-resources
          - path: ${{ github.workspace }}/coverage/no_resources
          - if-no-files-found: error


  coverage:
      needs:
        - functional_validate_driver
        - no_resource_validate_driver
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - uses: ./.github/actions/setup-go-env
        - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            name: coverage-no-resources
            path: ${{ github.workspace }}/coverage/no_resources
        - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            name: coverage-full-func
            path: ${{ github.workspace }}/coverage/full_func
        - run: |
            mkdir -p ${{ github.workspace }}/coverage/merged
            go tool covdata merge -i=${{ github.workspace }}/coverage/no_resources,${{ github.workspace }}/coverage/full_func -o ${{ github.workspace }}/coverage/merged
            go tool covdata textfmt -i=${{ github.workspace }}/coverage/merged -o=${{ github.workspace }}/coverage.out
        - run: |
            go tool cover -func=${{ github.workspace }}/coverage.out |awk -v threshold=${{ env.COVERAGE_THRESHOLD }} '{split($1,t,":") ; sub(/%$/,"",$3) ; files[t[1]]+=$3 ; files_a[t[1]]++} END {for (k in files) { if (k != "total") printf ("%80s --> %.2f%%\n",k,files[k]/files_a[k]);} } END {printf ("%80s --> %.2f%%\n","total",files["total"]) ; if (files["total"] < threshold) {exit 1}} '

