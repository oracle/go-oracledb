check_mem_usage:
  extends:
    - .mr-common-rules
  stage: test
  script:
    # see later as it requires Clang/LLVM
    #- $GOPATH/go/bin/go test -v -msan -short $($GOPATH/go/bin/go list $CI_PROJECT_DIR/... | grep -v /vendor/)
    - echo "enough for now."


coverage:
  extends:
    - .mr-common-rules
  needs: ["unit_tests"]
  stage: test
  script:
    # we accept 80% and more
    - $GOPATH/go/bin/go tool cover -func $CI_PROJECT_DIR/.go/coverage-ttc.out | awk 'BEGIN {ec=0} {split($1,t,":") ; sub(/%$/,"",$3) ; files[t[1]]+=int($3) ; files_a[t[1]]++} END {for (k in files) { printf ("%80s --> %d%%\n",k,files[k]/files_a[k]);if ((files[k]/files_a[k]) < 80 ) ec=1}} END {exit ec}'
  allow_failure: true

build:
  extends:
    - .mr-common-rules
  stage: build
  script:
    # dependencies
    - $GOPATH/go/bin/go get -x ./...
    - $GOPATH/go/bin/go build ./...

doc:
  stage: documentation
  tags:
    - JDBC.tools
  script:
    # TODO : find better than that
    #  we are running as gitlab-runner
    - /bin/rsync -avu --delete --exclude .git/ $CI_PROJECT_DIR/ /usr/local/home/gitlab-runner/wks/go-driver/
    - /bin/systemctl --user restart  go-driver-godoc.service
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when : never

deploy:
  stage: deploy
  script:
    - echo "one day, we gonna have something here"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when : never

scheduled_validate_driver:
  tags:
    - JDBC.service.enabled
  extends:
    - .periodic-validation-common-rules
  stage: function_validation
  timeout: 360s
  services:
    - name: database/free:latest-lite-cooked 
      alias: oracledb
  script:
    - echo "'$RUN_DESCRIPTION'"
    - $GOPATH/go/bin/go get -x ./...
    - $GOPATH/go/bin/go test -parallel=10  -shuffle=on -v $ORACLE_DRIVER_MODULE -run TestCategoryExecutor -driver.config.filename=$GO_DRIVER_CONFIGURATIONS -driver.config.name=${SCHEDULED_CONFIG}  -test.category=$OGD_TEST_CATEGORY

validate_driver:
  tags:
    - JDBC.service.enabled
  extends:
    - .mr-common-rules
  stage: function_validation
  timeout: 800s
  services:
    - name: database/free:latest-lite-cooked
      alias: oracledb
  script:
    - $GOPATH/go/bin/go get -x ./...
    - mkdir -p $CI_PROJECT_DIR/configurations
    - cp $WALLET $CI_PROJECT_DIR/configurations/ewallet.pem
    - $GOPATH/go/bin/go test -parallel=10  -shuffle=on -v $ORACLE_DRIVER_MODULE -run TestCategoryExecutor -driver.config.filename=$GO_DRIVER_CONFIGURATIONS -driver.config.name=pipeline_test  -test.category="sanity"


bench_driver:
  tags:
    - JDBC.service.enabled
  extends:
    - .mr-common-rules
  stage: function_validation
  timeout: 800s
  services:
    - name: database/free:latest-lite-cooked
      alias: oracledb
  script:
    - $GOPATH/go/bin/go get -x ./...
    - $GOPATH/go/bin/go test -parallel=10  -shuffle=on -v $($GOPATH/go/bin/go list $CI_PROJECT_DIR/oracle/... | egrep -v /vendor/) -run=^$ -bench=. -benchmem -benchtime=10x -driver.config.filename=$GO_DRIVER_CONFIGURATIONS -driver.config.name=pipeline_test

